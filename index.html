<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Batch Assist</title>

<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#e0f2fe,#f8fafc);}
h1{text-align:center;padding:18px;color:#fff;background:linear-gradient(90deg,#2563eb,#06b6d4);margin:0;font-weight:900;}
.container{padding:16px}
.card{background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 25px rgba(0,0,0,0.08);}
.card.cow{border-left:6px solid #7c3aed;}
.card.gold{border-left:6px solid #f59e0b;}
.card.tmate{border-left:6px solid #dc2626;}
.card.fcm{border-left:6px solid #0f766e;}
.card.cow h3{color:#7c3aed;}
.card.gold h3{color:#ea580c;}
.card.tmate h3{color:#dc2626;}
h3{margin-bottom:14px;font-weight:900;}
.row{display:flex;gap:12px;margin-top:10px;}
.col{flex:1;min-width:0;}
.col.big{flex:1.333;}
.col.small{flex:1;}
.field{position:relative;margin-top:14px;}
.field input{width:100%;padding:14px;border-radius:12px;border:2px solid #cbd5f5;box-sizing:border-box;font-size:20px;font-weight:700;color:#111827;}
.field input:focus{border-color:#2563eb;box-shadow:0 0 8px rgba(37,99,235,0.3);}
.field label{position:absolute;top:-8px;left:10px;background:#fff;padding:2px 6px;font-size:12px;font-weight:800;color:#1e40af;border-radius:6px;}
button{width:100%;padding:16px;border:none;border-radius:16px;margin-top:12px;background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff;font-weight:900;}
.toggle{background:#2563eb;display:none;}
table{width:100%;margin-top:14px;border-collapse:collapse;display:none;background:#fff;border-radius:12px;}
th,td{padding:12px;text-align:center;}
th{background:#3b82f6;color:white;}
.total{background:#fde68a;font-weight:900;}
.calc{display:none;margin-top:14px;}
.calc-card{margin-bottom:16px;padding:16px;border-radius:16px;background:#ffffff;box-shadow:0 6px 18px rgba(0,0,0,0.1);}
.panel{margin-top:10px;padding:12px;border-radius:12px;}
.fat{background:#fff7ed;border-left:5px solid #f97316;}
.snf{background:#eff6ff;border-left:5px solid #2563eb;}
.step{margin-bottom:6px;font-size:14px;}
summary{list-style:none;cursor:pointer;font-size:18px;font-weight:800;padding:6px 0;display:flex;align-items:center;gap:8px;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"▶";display:inline-block;transition:transform .25s ease;font-size:14px;}
details[open] > summary::before{transform:rotate(90deg);}
.card.cow summary{color:#7c3aed;}
.card.gold summary{color:#ea580c;}
.card.tmate summary{color:#dc2626;}
.card.fcm summary{color:#0f766e;}

.mode-row{display:flex;align-items:center;gap:14px;}
.mode-label{font-weight:700;min-width:64px;}
.settings-btn{
margin-left:auto;
width:32px;
height:32px;
padding:0;
border:none;
background:transparent;
box-shadow:none;
color:#1d4ed8;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
line-height:1;
cursor:pointer;
transform:translateY(-4px);
transition:transform .25s ease,color .25s ease;
}
.settings-btn:hover{
transform:translateY(-4px) rotate(90deg);
color:#2563eb;
}


@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-18px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}



.app-header{
margin:12px 16px 10px;
height:60px;
display:flex;
align-items:center;
background:#F8FBFF;
border:2px solid #C62828;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.05);
}
.brand{
display:grid;
grid-template-columns:56px 1fr 56px;
align-items:center;
width:100%;
padding:0 12px;
}
.brand img{width:46px;height:46px}
.brand span{
justify-self:center;
font-size:20px;
font-weight:700;
color:#163B84;
}

</style>
</head>

<div class="container">
<div style="background:#ffffffcc;border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;font-weight:800;">
<span class="mode-label">Mode</span>
<select id="mode" style="padding:6px 10px;border-radius:8px;margin-left:10px;">
<option value="plant">Plant Mode</option>
<option value="density">Density Mode</option>
</select>
<button onclick="openSettings()" class="settings-btn" style="margin-left:auto;align-self:center;" title="Settings">&#9881;</button>
</div>

<details class="card cow">
<summary>Cow Milk</summary>

<div class="field"><label>Batch Qty</label><input id="T" type="number" oninput="updateRaw()"></div>

<div class="row">
<div class="col"><div class="field"><label>Water (L)</label><input id="W" type="number" oninput="updateRaw()"></div></div>
<div class="col"><div class="field"><label>Skim (L)</label><input id="S" type="number" oninput="updateRaw()"></div></div></div>

<div class="row">
<div class="col"><div class="field"><label>Cream (L)</label><input id="C" type="number" value="0" oninput="updateRaw()"></div></div>
<div class="col"><div class="field"><label>Fat %</label><input id="CF" type="number" value="40"></div></div>
<div class="col"><div class="field"><label>SNF %</label><input id="CS" type="number" value="5.8"></div></div>
</div>


<div class="row">
<div class="col"><div class="field"><label>WMP Bags</label><input id="WBAGS" type="number"></div></div>
</div>

<div class="row">
<div class="col big"><div class="field"><label>Leak</label><input id="LQ" type="number" oninput="updateRaw()"></div></div>
<div class="col small"><div class="field"><label>Fat %</label><input id="LF" type="number"></div></div>
<div class="col small"><div class="field"><label>SNF %</label><input id="LS" type="number"></div></div>
</div>

<div class="row">
<div class="col big"><div class="field"><label>RCM (L)</label><input id="R" type="number" readonly></div></div>
<div class="col small"><div class="field"><label>Fat %</label><input id="F" type="number"></div></div>
<div class="col small"><div class="field"><label>SNF %</label><input id="SNF" type="number"></div></div>
</div>

<button onclick="calculateAndScroll('cow')" style="background:#7c3aed;">Calculate Batch</button>

</details>

<details class="card gold">
<summary>Gold Milk</summary>
<div class="field"><label>Batch Qty</label><input id="GT" type="number"></div>
<div class="row">
<div class="col"><div class="field"><label>RCM Fat %</label><input id="GF" type="number"></div></div>
<div class="col"><div class="field"><label>RCM SNF %</label><input id="GS" type="number"></div></div>
</div>
<div class="row">
<div class="col"><div class="field"><label>Cream (L)</label><input id="GC" type="number" value="0"></div></div>
<div class="col"><div class="field"><label>Fat %</label><input id="GCF" type="number" value="40"></div></div>
<div class="col"><div class="field"><label>SNF %</label><input id="GCS" type="number" value="5.8"></div></div>
</div>

<button onclick="calculateAndScroll('gold')" style="background:#f59e0b;">Calculate Batch</button>

</details>

<details class="card tmate">
<summary>TMate Milk</summary>
<div class="field"><label>Batch Qty</label><input id="TT" type="number"></div>
<div class="row">
<div class="col"><div class="field"><label>RCM Fat %</label><input id="TF" type="number"></div></div>
<div class="col"><div class="field"><label>RCM SNF %</label><input id="TS" type="number"></div></div>
</div>
<div class="row">

<b>FINAL BATCH</b><span id="BC_FB" style="font-size:28px;font-weight:900;">0 L</span>

<div style="background:#1d4ed8;color:#fff;padding:8px;border-radius:12px;text-align:center;font-size:17px;font-weight:700;margin:-20px -20px 18px -20px;">
Batch Requirement
</div>
<div id="summary" style="text-align:center;font-size:18px;font-weight:700;margin-bottom:14px;color:#374151;"></div>
<div id="req"></div>
</div>

</div>

<script>

// Settings defaults
const DEFAULT_SETTINGS={
  skimSNF:9.0,
  smpSNF:96.5,
  wmpFat:26.0,
  wmpSNF:70.5
};
function getSetting(key){
  const v=localStorage.getItem(key);
  return (v===null||v==="")?DEFAULT_SETTINGS[key]:parseFloat(v);
}
const skimSNF=getSetting("skimSNF");
const smpSNF=getSetting("smpSNF");
const wmpFat=getSetting("wmpFat");
const wmpSNF=getSetting("wmpSNF");


function clean(n){let x=Math.round(n*10)/10;return (x%1===0)?x.toFixed(0):x.toFixed(1);}
const settings={
skimSNF:parseFloat(localStorage.getItem('skimSNF'))||8.4,
smpSNF:(()=>{
 const v=parseFloat(localStorage.getItem('smpSNF'));
 return (!isFinite(v)||v<10)?96.5:v;
})(),
boFat:parseFloat(localStorage.getItem('boFat'))||82.5,
wmpFat:parseFloat(localStorage.getItem('wmpFat'))||26,
wmpSNF:parseFloat(localStorage.getItem('wmpSNF'))||70
};

function updateRaw(){
let t=+T.value||0,w=+W.value||0,s=+S.value||0,c=+C.value||0,l=+LQ.value||0;
R.value=Math.max(0,t-w-s-c-l);
}

function toggle(){
const c=document.getElementById("calc");
const btn=document.getElementById("btn");
if(c.style.display==="block"){
 c.style.display="none";
 btn.innerText="View Calculation";
 return;
}
c.style.display="block";
btn.innerText="Hide Calculation";
setTimeout(()=>{
 const y=c.getBoundingClientRect().top+window.pageYOffset-10;
 window.scrollTo({top:y,behavior:"smooth"});
},30);
}

function density(f,s){
return 1+(4*(s-(0.2*f)-0.36))/1000;
}

function buildCard(type,name,t,r,f,snf,s,lq,lf,ls,fatPct,snfPct,mode){
let d=1;
if(mode==="density"){
if(name==="Cow Milk") d=1.029;
else if(name==="Gold Milk") d=1.031;
else d=1.034;
}

let rawD=(mode==="density")?density(f,snf):1;

let tTxt=(mode==="density")?`(${t}×${d.toFixed(3)})`:`${t}`;
let rTxt=(mode==="density")?`(${r}×${rawD.toFixed(3)})`:`${r}`;

let t_mass=t*d;
let r_mass=r*rawD;

let fatAvail=(r_mass*f/100);
let snfAvail=(r_mass*snf/100);

let fatAvailTxt=`[ ${rTxt} × ${f}/100 ]`;
let snfAvailTxt=`[ ${rTxt} × ${snf}/100 ]`;

if(type==="cow"){
const creamQty=(+C.value||0);
if(creamQty>0){
fatAvail+=creamQty*(+CF.value||0)/100;
snfAvail+=creamQty*(+CS.value||0)/100;
fatAvailTxt+=` + [ ${creamQty} × ${+CF.value||0}/100 ]`;
snfAvailTxt+=` + [ ${creamQty} × ${+CS.value||0}/100 ]`;
}
}else if(type==="gold"){
fatAvail+=(+GC.value||0)*(+GCF.value||0)/100;
snfAvail+=(+GC.value||0)*(+GCS.value||0)/100;
fatAvailTxt+=` + [ ${+GC.value||0} × ${+GCF.value||0}/100 ]`;
snfAvailTxt+=` + [ ${+GC.value||0} × ${+GCS.value||0}/100 ]`;
}else if(type==="tmate"){
fatAvail+=(+TC.value||0)*(+TCF.value||0)/100;
snfAvail+=(+TC.value||0)*(+TCS.value||0)/100;
fatAvailTxt+=` + [ ${+TC.value||0} × ${+TCF.value||0}/100 ]`;
snfAvailTxt+=` + [ ${+TC.value||0} × ${+TCS.value||0}/100 ]`;
}else if(type==="fcm"){
fatAvail+=(+FC.value||0)*(+FCF.value||0)/100;
snfAvail+=(+FC.value||0)*(+FCS.value||0)/100;
fatAvailTxt+=` + [ ${+FC.value||0} × ${+FCF.value||0}/100 ]`;
snfAvailTxt+=` + [ ${+FC.value||0} × ${+FCS.value||0}/100 ]`;
}

if(name==="Cow Milk"){
let leakD=(mode==="density")?density(lf,ls):1;
let l_mass=lq*leakD;
let lTxt=(mode==="density")?`(${lq}×${leakD.toFixed(3)})`:`${lq}`;
if(lq){
fatAvail+=l_mass*lf/100;
snfAvail+=l_mass*ls/100;
fatAvailTxt+=` + [ ${lTxt} × ${lf}/100 ]`;
snfAvailTxt+=` + [ ${lTxt} × ${ls}/100 ]`;
}
}

if(s){
let sTxt=(mode==="density")?`(${s}×1.030)`:`${s}`;
snfAvail+=((mode==="density")?(s*1.03):s)*settings.skimSNF/100;
snfAvailTxt+=` + [ ${sTxt} × ${settings.skimSNF}/100 ]`;
}
let wkg=(type==='cow')?((+WBAGS.value||0)*25):0;
let wfat=settings.wmpFat;
let wsnf=settings.wmpSNF;
if(wkg){
 fatAvail+=wkg*wfat/100;
 snfAvail+=wkg*wsnf/100;
 fatAvailTxt+=` + [ ${wkg} × ${wfat}/100 ]`;
 snfAvailTxt+=` + [ ${wkg} × ${wsnf}/100 ]`;
}

let fatReq=t_mass*fatPct/100;
let fatReqTxt=`${tTxt} × ${fatPct}/100`;

let fatDef=fatReq-fatAvail;
let BO=fatDef/(settings.boFat/100);
let cans=BO / 40;

let snfReq=t_mass*snfPct/100;
let snfReqTxt=`${tTxt} × ${snfPct}/100`;

let snfDef=snfReq-snfAvail;
let SMP=snfDef/(settings.smpSNF/100);
let bags=SMP/25;

return `<div class="calc-card"><h3>${name}</h3>
<div class="panel fat">
<h4>FAT</h4>
<div class="step">Required: ${fatReqTxt} = ${clean(fatReq)} kg</div>
<div class="step">Available: ${fatAvailTxt} = ${clean(fatAvail)} kg</div>
<div class="step">Deficit: ${clean(fatDef)} kg</div>
<div class="step">B.Oil Required: ${clean(BO)} kg</div>
<div class="step">B.Oil: ${clean(cans)} Cans</div>
</div>
<div class="panel snf">
<h4>SNF</h4>
<div class="step">Required: ${snfReqTxt} = ${clean(snfReq)} kg</div>
<div class="step">Available: ${snfAvailTxt} = ${clean(snfAvail)} kg</div>
<div class="step">Deficit: ${clean(snfDef)} kg</div>
<div class="step">SMP Required: ${clean(SMP)} kg</div>
<div class="step">SMP: ${clean(bags)} Bags</div>
</div></div>`;
}


function calculateAndScroll(type){
  calc(type);
  setTimeout(()=>{
    const result=document.getElementById('tbl');
    if(result && result.style.display!=="none"){
      result.scrollIntoView({behavior:'smooth',block:'start'});
    }
  },100);
}

function calc(type){
let mode=document.getElementById("mode").value;
let rows="",cards="",tBO=0,tSMP=0,tWMP=0;

/* Cow */
if((!type||type==='cow') && T.value){
let t=+T.value,r=+R.value,f=+F.value,snf=+SNF.value;
let s=+S.value||0,lq=+LQ.value||0,lf=+LF.value||0,ls=+LS.value||0;

let d=(mode==="density")?1.029:1;
let rawD=(mode==="density")?density(f,snf):1;
let leakD=(mode==="density")?density(lf,ls):1;

let t_mass=t*d;
let r_mass=r*rawD;
let l_mass=lq*leakD;

let BO=((t_mass*3.5/100)-((r_mass*f/100)+(l_mass*lf/100)+(((+WBAGS.value||0)*25*settings.wmpFat)/100)))/(settings.boFat/100);
let SMP=((t_mass*8.5/100)-((r_mass*snf/100)+((mode==="density")?(s*1.03):s)*settings.skimSNF/100+(l_mass*ls/100)+(((+WBAGS.value||0)*25*settings.wmpSNF)/100)))/(settings.smpSNF/100);

let cans=BO / 40;
let bags=SMP/25;

rows+=`<tr class="total"><td><b>Cow</b></td><td><b>${clean(cans)}</b></td><td><b>${clean(bags)}</b></td><td><span style='background:#fff;padding:5px 12px;border-radius:10px;border:2px solid #f59e0b;font-weight:700;font-size:17px;display:inline-block;min-width:74px;text-align:center;color:#92400e;'>${clean(+WBAGS.value||0)}</span></td></tr>`;
 tWMP+=(+WBAGS.value||0);
tBO+=cans;tSMP+=bags;
cards+=buildCard("cow","Cow Milk",t,r,f,snf,s,lq,lf,ls,3.5,8.5,mode);
}

/* Gold */
if((!type||type==='gold') && GT.value){
let t=+GT.value,c=+GC.value||0,r=t-c,f=+GF.value,snf=+GS.value;
let d=(mode==="density")?1.031:1;
let rawD=(mode==="density")?density(f,snf):1;

let t_mass=t*d;
let r_mass=r*rawD;

let BO=((t_mass*4.5/100)-((r_mass*f/100)+((+GC.value||0)*(+GCF.value||0)/100)))/(settings.boFat/100);
let SMP=((t_mass*9/100)-((r_mass*snf/100)+((+GC.value||0)*(+GCS.value||0)/100)))/(settings.smpSNF/100);

let cans=BO / 40;
let bags=SMP/25;

rows+=`<tr class="total"><td><b>Gold</b></td><td><b>${clean(cans)}</b></td><td><b>${clean(bags)}</b></td><td><b>—</b></td></tr>`;
tBO+=cans;tSMP+=bags;
cards+=buildCard("gold","Gold Milk",t,r,f,snf,0,0,0,0,4.5,9,mode);
}

/* TMate */
if((!type||type==='tmate') && TT.value){
let t=+TT.value,c=+TC.value||0,r=t-c,f=+TF.value,snf=+TS.value;
let d=(mode==="density")?1.034:1;
let rawD=(mode==="density")?density(f,snf):1;

let t_mass=t*d;
let r_mass=r*rawD;

let BO=((t_mass*5.5/100)-((r_mass*f/100)+((+TC.value||0)*(+TCF.value||0)/100)))/(settings.boFat/100);
let SMP=((t_mass*10/100)-((r_mass*snf/100)+((+TC.value||0)*(+TCS.value||0)/100)))/(settings.smpSNF/100);

let cans=BO / 40;
let bags=SMP/25;

rows+=`<tr class="total"><td><b>TMate</b></td><td><b>${clean(cans)}</b></td><td><b>${clean(bags)}</b></td><td><b>—</b></td></tr>`;
tBO+=cans;tSMP+=bags;
cards+=buildCard("tmate","TMate Milk",t,r,f,snf,0,0,0,0,5.5,10,mode);
}


/* FCM */
if((!type||type==='fcm') && FT.value){
 let t=+FT.value,c=+FC.value||0,r=t-c,f=+FF.value,snf=+FS.value;
 let d=(mode==="density")?1.034:1;
 let rawD=(mode==="density")?density(f,snf):1;
 let t_mass=t*d,r_mass=r*rawD;
 let BO=((t_mass*6.0/100)-((r_mass*f/100)+((+FC.value||0)*(+FCF.value||0)/100)))/(settings.boFat/100);
 let SMP=((t_mass*9.0/100)-((r_mass*snf/100)+((+FC.value||0)*(+FCS.value||0)/100)))/(settings.smpSNF/100);
 let cans=BO / 40;
 let bags=SMP/25;
 rows+=`<tr class="total"><td><b>FCM</b></td><td><b>${clean(cans)}</b></td><td><b>${clean(bags)}</b></td><td><b>—</b></td></tr>`;
 tBO+=cans;tSMP+=bags;
 cards+=buildCard("fcm","FCM",t,r,f,snf,0,0,0,0,6.0,9.0,mode);
}



if(rows){
let milk = type==='cow' ? 'Cow Milk' :
           type==='gold' ? 'Gold Milk' :
           type==='tmate' ? 'TMate Milk' : 'FCM';
const sum=document.getElementById("summary");
sum.textContent=milk;
sum.style.fontSize="20px";
sum.style.fontWeight="800";
sum.style.color=(type==="cow")?"#7c3aed":(type==="gold")?"#ea580c":(type==="tmate")?"#dc2626":"#0f766e";
let water=(type==='cow')?(+W.value||0):0;
let htmlReq=`
<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e5e7eb;font-size:20px;">
<span style='color:#d97706;font-size:18px;font-weight:800;'>Butter Oil (Cans)</span><span style='background:#fff;width:118px;height:48px;line-height:44px;padding:0;border-radius:14px;border:2.5px solid #f59e0b;font-weight:800;font-size:22px;color:#000;display:inline-block;text-align:center;box-sizing:border-box;'>${clean(tBO)}</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e5e7eb;font-size:20px;">
<span style='color:#16a34a;font-size:18px;font-weight:800;'>SMP (Bags)</span><span style='background:#fff;width:118px;height:48px;line-height:44px;padding:0;border-radius:14px;border:2.5px solid #22c55e;font-weight:800;font-size:22px;color:#000;display:inline-block;text-align:center;box-sizing:border-box;'>${clean(tSMP)}</span></div>`;
if(type==='cow' && (+WBAGS.value||0)>0){
htmlReq+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e5e7eb;font-size:20px;">
<span style='color:#DC2626;font-size:18px;font-weight:800;'>WMP (Bags)</span><span style='background:#fff;width:118px;height:48px;line-height:44px;padding:0;border-radius:14px;border:2.5px solid #DC2626;font-weight:800;font-size:22px;color:#000;display:inline-block;text-align:center;box-sizing:border-box;'>${clean(+WBAGS.value||0)}</span></div>`;
}
if((!type||type==='cow') && T.value){
htmlReq+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:20px;">
<span style='color:#2563eb;font-size:18px;font-weight:800;'>Water (L)</span><span style='background:#fff;width:118px;height:48px;line-height:44px;padding:0;border-radius:14px;border:2.5px solid #3b82f6;font-weight:800;font-size:22px;color:#000;display:inline-block;text-align:center;box-sizing:border-box;'>${clean(water)}</span></div>`;
}
document.getElementById("req").innerHTML=htmlReq;
document.getElementById("tbl").style.display="block";
document.getElementById("calc").innerHTML=cards;
document.getElementById("btn").style.display="block";
}
}

function updateCorrection(){
let b=+BC_BATCH.value||0,bf=+BC_BF.value||0,bs=+BC_BS.value||0;
let r=+BC_RCM.value||0,rf=+BC_RF.value||0,rs=+BC_RS.value||0;
let sk=+BC_SKIM.value||0;
let w=+BC_W.value||0;
let cream=+BCCream.value||0;
let creamFat=+BCCreamFat.value||0;
let creamSNF=+BCCreamSNF.value||0;
let bo=(+BC_BO.value||0)*40;
let smp=(+BC_SMP.value||0)*25;
let wmp=(+BC_WMP.value||0)*25;

let finalBatch=b+r+sk+w+cream+bo;

let fatkg=b*bf/100+r*rf/100+cream*(creamFat/100)+bo*(settings.boFat/100)+wmp*(settings.wmpFat/100);
let snfkg=b*bs/100+r*rs/100+cream*(creamSNF/100)+sk*(settings.skimSNF/100)+smp*(settings.smpSNF/100)+wmp*(settings.wmpSNF/100);

BC_FB.textContent=Math.round(finalBatch).toLocaleString('en-IN')+' L';
BC_FATOUT.textContent=finalBatch?(fatkg/finalBatch*100).toFixed(2):'0.00';
BC_SNFOUT.textContent=finalBatch?(snfkg/finalBatch*100).toFixed(2):'0.00';


let batchParts=[],batchVals=[];
batchParts.push("Batch"); batchVals.push(b);
if(r){batchParts.push("RCM");batchVals.push(r);}
if(sk){batchParts.push("Skim");batchVals.push(sk);}
if(w){batchParts.push("Water");batchVals.push(w);}
if(cream){batchParts.push("Cream");batchVals.push(cream);}
if(bo){batchParts.push("Butter Oil");batchVals.push(bo);}

let fatLines=[],fatTerms=[];
fatLines.push(`Batch = ${b} × ${bf}/100 = ${(b*bf/100).toFixed(2)} kg`); fatTerms.push((b*bf/100).toFixed(2));
if(r){fatLines.push(`RCM = ${r} × ${rf}/100 = ${(r*rf/100).toFixed(2)} kg`);fatTerms.push((r*rf/100).toFixed(2));}
if(cream){fatLines.push(`Cream = ${cream} × ${creamFat}/100 = ${(cream*(creamFat/100)).toFixed(2)} kg`);fatTerms.push((cream*(creamFat/100)).toFixed(2));}
if(bo){fatLines.push(`Butter Oil = ${bo} × ${settings.boFat}/100 = ${(bo*(settings.boFat/100)).toFixed(2)} kg`);fatTerms.push((bo*(settings.boFat/100)).toFixed(2));}
if(wmp){fatLines.push(`WMP = ${(+BC_WMP.value||0)} × 25 × ${settings.wmpFat}/100 = ${(wmp*(settings.wmpFat/100)).toFixed(2)} kg`);fatTerms.push((wmp*(settings.wmpFat/100)).toFixed(2));}

let snfLines=[],snfTerms=[];
snfLines.push(`Batch = ${b} × ${bs}/100 = ${(b*bs/100).toFixed(2)} kg`);snfTerms.push((b*bs/100).toFixed(2));
if(r){snfLines.push(`RCM = ${r} × ${rs}/100 = ${(r*rs/100).toFixed(2)} kg`);snfTerms.push((r*rs/100).toFixed(2));}
if(cream){snfLines.push(`Cream = ${cream} × ${creamSNF}/100 = ${(cream*(creamSNF/100)).toFixed(2)} kg`);snfTerms.push((cream*(creamSNF/100)).toFixed(2));}
if(sk){snfLines.push(`Skim = ${sk} × ${settings.skimSNF}/100 = ${(sk*(settings.skimSNF/100)).toFixed(2)} kg`);snfTerms.push((sk*(settings.skimSNF/100)).toFixed(2));}
if(smp){snfLines.push(`SMP = ${(+BC_SMP.value||0)} × 25 × ${settings.smpSNF}/100 = ${(smp*(settings.smpSNF/100)).toFixed(2)} kg`);snfTerms.push((smp*(settings.smpSNF/100)).toFixed(2));}
if(wmp){snfLines.push(`WMP = ${(+BC_WMP.value||0)} × 25 × ${settings.wmpSNF}/100 = ${(wmp*(settings.wmpSNF/100)).toFixed(2)} kg`);snfTerms.push((wmp*(settings.wmpSNF/100)).toFixed(2));}

BC_CALC.innerHTML=
`<b>Final Batch</b><br>
= ${batchParts.join(" + ")}<br>
= ${batchVals.join(" + ")}<br>
= <b>${finalBatch.toFixed(1)} L</b><br><br>

<b>FAT</b><br>
${fatLines.join("<br>")}<br>
Total Fat = ${fatTerms.join(" + ")} = <b>${fatkg.toFixed(2)} kg</b><br>
Final Fat = ${fatkg.toFixed(2)} / ${finalBatch.toFixed(1)} × 100 = <b>${(fatkg/finalBatch*100).toFixed(2)} %</b><br><br>

<b>SNF</b><br>
${snfLines.join("<br>")}<br>
Total SNF = ${snfTerms.join(" + ")} = <b>${snfkg.toFixed(2)} kg</b><br>
Final SNF = ${snfkg.toFixed(2)} / ${finalBatch.toFixed(1)} × 100 = <b>${(snfkg/finalBatch*100).toFixed(2)} %</b>`;

}



function toggleBCCalc(){
 const d=document.getElementById("BC_CALC_WRAP");
 d.style.display=d.style.display==="none"?"block":"none";
}

function resetCorrection(){
 if(!confirm("Clear all Batch Correction values?")) return;
 [BC_BATCH,BC_BF,BC_BS,BC_RCM,BC_RF,BC_RS,BCCream,BCCreamFat,BCCreamSNF,BC_W,BC_SKIM,BC_BO,BC_SMP,BC_WMP].forEach(e=>e.value="");
 updateCorrection();
}

function openSettings(){
SET_SKIM.value=settings.skimSNF;
SET_SMP.value=settings.smpSNF;
SET_BOFAT.value=settings.boFat;
SET_WFAT.value=settings.wmpFat;
SET_WSNF.value=settings.wmpSNF;
settingsModal.style.display='block';
}
function closeSettings(){settingsModal.style.display='none';}
function saveSettings(){
localStorage.setItem('skimSNF',SET_SKIM.value);
localStorage.setItem('smpSNF',SET_SMP.value);
localStorage.setItem('boFat',SET_BOFAT.value);
localStorage.setItem('wmpFat',SET_WFAT.value);
localStorage.setItem('wmpSNF',SET_WSNF.value);
settings.skimSNF=parseFloat(SET_SKIM.value)||8.4;
settings.smpSNF=(function(){
 let v=parseFloat(SET_SMP.value);
 if(!isFinite(v)||v<10) v=96.5;
 SET_SMP.value=v;
 localStorage.setItem('smpSNF',v);
 return v;
})();
settings.boFat=parseFloat(SET_BOFAT.value)||82.5;
settings.wmpFat=parseFloat(SET_WFAT.value)||26;
settings.wmpSNF=parseFloat(SET_WSNF.value)||70;
closeSettings();
alert('Settings saved');
}


function resetSettings(){
SET_SKIM.value=8.4;SET_SMP.value=96.5;SET_BOFAT.value=82.5;SET_WFAT.value=26;SET_WSNF.value=70;
saveSettings();
}
function exportSettings(){
const data={skimSNF:settings.skimSNF,smpSNF:settings.smpSNF,boFat:settings.boFat,wmpFat:settings.wmpFat,wmpSNF:settings.wmpSNF};
prompt('Copy Settings JSON',JSON.stringify(data));
}
function importSettings(){
let s=prompt('Paste Settings JSON');
if(!s)return;
try{
let d=JSON.parse(s);
SET_SKIM.value=d.skimSNF??8.4;
SET_SMP.value=d.smpSNF??96.5;
SET_BOFAT.value=d.boFat??82.5;
SET_WFAT.value=d.wmpFat??26;
SET_WSNF.value=d.wmpSNF??70;
saveSettings();
}catch(e){alert('Invalid JSON');}
}

</script>


<div id="settingsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;animation:fade .2s;">
<div style="background:#fff;width:340px;max-width:92%;margin:70px auto;border-radius:18px;padding:20px;animation:pop .25s ease;">
<h2 style="margin-top:0">⚙️ Milk Solid Constants</h2>
<div class="field"><label>Skim SNF %</label><input id="SET_SKIM" type="number"></div>
<div class="field"><label>SMP SNF %</label><input id="SET_SMP" type="number"></div>
<div class="field"><label>Butter Oil Fat %</label><input id="SET_BOFAT" type="number"></div>
<div class="field"><label>WMP Fat %</label><input id="SET_WFAT" type="number"></div>
<div class="field"><label>WMP SNF %</label><input id="SET_WSNF" type="number"></div>
<div style="display:flex;gap:10px;"><button onclick="saveSettings()">Save</button><button onclick="closeSettings()" style="background:#6b7280;">Back</button></div>
</div></div>


<script>
document.addEventListener('DOMContentLoaded',()=>{
 document.querySelectorAll('details').forEach(d=>{
   d.addEventListener('toggle',function(){
     if(!this.open) return;
     setTimeout(()=>{
       const top=this.getBoundingClientRect().top+window.pageYOffset-12;
       const scroller=document.scrollingElement||document.documentElement;
       scroller.scrollTo({top:top,behavior:'smooth'});
     },350);
   });
 });
});
</script>

</body>
